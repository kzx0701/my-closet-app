<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建家庭 — MyCloset 家庭衣橱</title>
<link rel="stylesheet" href="../assets/design-system.css">
<style>
  .form-page { padding-top: 96px; }
  .form-page-hero { padding: 0 28px 24px; position: relative; z-index: 2; color: var(--color-text-inverse); }
  .form-page-hero .scope-title { margin-bottom: 10px; }
  .form-page-hero .scope-desc { margin-bottom: 0; max-width: 280px; }
  .form-body { padding: 24px 28px 130px; position: relative; z-index: 2; }
  .form-section-title {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--color-text-placeholder); margin-bottom: 12px; margin-top: 24px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .form-section-title .hint { font-family: var(--font-sans); font-size: 11px; color: var(--color-text-placeholder); text-transform: none; letter-spacing: 0; }
  .form-section-title:first-child { margin-top: 0; }
  .form-bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 28px 36px;
    background: linear-gradient(180deg, rgba(244,239,230,0) 0%, var(--color-bg-page) 30%);
    z-index: 30;
  }
  .preview-card {
    background: var(--color-bg-card-end);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    padding: 22px;
    margin-bottom: 24px;
  }
  .preview-label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--color-terra); margin-bottom: 8px; display: block;
  }
  .preview-name {
    font-family: var(--font-serif); font-size: 20px; font-weight: 600;
    color: var(--color-primary-dark); margin-bottom: 14px;
    letter-spacing: -0.3px;
  }
  .preview-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0;
    border-top: 1px solid var(--color-border-soft);
  }
  .preview-key {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--color-text-placeholder);
  }
  .preview-val {
    font-family: var(--font-serif); font-size: 14px; font-weight: 500;
    color: var(--color-primary-dark);
  }
  .preview-val.code {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 2px;
    color: var(--color-terra);
  }
</style>
</head>
<body>
<div class="device">
  <div class="device-screen">
    <div class="dynamic-island"></div>
    <div class="status-bar light">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg viewBox="0 0 18 14" fill="currentColor"><path d="M9 1c3 0 5.7 1.1 7.8 3l-1.5 1.6C13.5 4 11.3 3 9 3S4.5 4 2.7 5.6L1.2 4C3.3 2.1 6 1 9 1zm0 4c2 0 3.8.7 5.2 2l-1.5 1.6C11.6 7.6 10.4 7 9 7s-2.6.6-3.7 1.6L3.8 7c1.4-1.3 3.2-2 5.2-2zm0 4c1 0 1.9.3 2.6 1l-2.6 2.7L6.4 10c.7-.7 1.6-1 2.6-1z"/></svg>
        <svg viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="19" height="9" rx="1.5" fill="currentColor"/><path d="M24 4v5h1.5V4H24z" fill="currentColor" opacity="0.5"/></svg>
      </div>
    </div>

    <div class="navbar on-hero" style="position: relative; z-index: 10; padding-top: 56px;">
      <button class="nav-back" data-back>
        <svg viewBox="0 0 24 24" class="icon"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="nav-title">创建家庭</span>
      <span style="width: 32px;"></span>
    </div>

    <div class="screen-content">
      <div class="page">
        <div class="page-bg"></div>

        <div class="form-page">
          <div class="form-page-hero fade-up delay-1">
            <div class="scope-badge">
              <span class="scope-badge-dot"></span>
              <span class="scope-badge-text">Family · 创建</span>
            </div>
            <h1 class="scope-title size-sm">创建家庭</h1>
            <p class="scope-desc">为家庭起一个名字。创建成功后将自动生成邀请码。</p>
          </div>

          <div class="form-body fade-up delay-2">
            <div class="form-section-title">家庭名称</div>
            <input type="text" class="form-input" placeholder="例如：林家小院" value="林家小院">

            <div class="form-section-title">家庭简介 <span class="hint">选填</span></div>
            <textarea class="form-textarea" placeholder="一句话描述你的家庭">四口之家，妈妈爱买衣，爸爸爱整理。</textarea>

            <!-- 创建后预览 -->
            <div class="form-section-title" style="margin-top: 32px;">预览 <span class="hint">创建后生效</span></div>
            <div class="preview-card">
              <span class="preview-label">Preview · 家庭预览</span>
              <div class="preview-name">林家小院</div>
              <div class="preview-row">
                <span class="preview-key">Creator</span>
                <span class="preview-val">林屿 · Admin</span>
              </div>
              <div class="preview-row">
                <span class="preview-key">Invite Code</span>
                <span class="preview-val code">MY-FAM-2024</span>
              </div>
              <div class="preview-row">
                <span class="preview-key">Members</span>
                <span class="preview-val">1 人（创建后可邀请）</span>
              </div>
            </div>
          </div>
        </div>

        <div class="form-bottom-bar">
          <button class="btn-submit" data-submit="home.html">创建家庭</button>
        </div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
</div>
<script src="../assets/prototype.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增衣物 — MyCloset 家庭衣橱</title>
<link rel="stylesheet" href="../assets/design-system.css">
<style>
  .form-page { padding-top: 96px; }
  .form-page-hero { padding: 0 28px 24px; position: relative; z-index: 2; color: var(--color-text-inverse); }
  .form-page-hero .scope-title { margin-bottom: 10px; }
  .form-page-hero .scope-desc { margin-bottom: 0; }
  .form-body { padding: 24px 28px 130px; position: relative; z-index: 2; }
  .form-section-title {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--color-text-placeholder); margin-bottom: 12px; margin-top: 24px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .form-section-title .hint { font-family: var(--font-sans); font-size: 11px; color: var(--color-text-placeholder); text-transform: none; letter-spacing: 0; }
  .form-section-title:first-child { margin-top: 0; }
  .image-upload {
    width: 100%;
    aspect-ratio: 1;
    background: var(--color-bg-card-end);
    border: 1.5px dashed var(--color-border);
    border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s ease;
  }
  .image-upload:hover { background: var(--color-bg-deep); border-color: var(--color-sage); }
  .image-upload svg { width: 36px; height: 36px; stroke: var(--color-text-placeholder); stroke-width: 1.4; fill: none; margin-bottom: 10px; }
  .image-upload .upload-title { font-family: var(--font-serif); font-size: 14px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 2px; }
  .image-upload .upload-sub { font-family: var(--font-sans); font-size: 11px; color: var(--color-text-placeholder); }
  .image-preview {
    width: 100%; aspect-ratio: 1; border-radius: 14px;
    background: linear-gradient(135deg, var(--color-bg-deep) 0%, var(--color-bg-card-end) 100%);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--color-border);
    position: relative;
  }
  .image-preview svg { width: 50%; height: 50%; stroke: var(--color-sage); stroke-width: 1.2; fill: none; opacity: 0.6; }
  .image-preview .season-mark {
    position: absolute; top: 12px; left: 12px;
    width: 4px; height: 22px; border-radius: 2px;
  }
  .image-preview .replace-btn {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.5); color: #fff;
    font-family: var(--font-sans); font-size: 11px; font-weight: 500;
    padding: 6px 12px; border-radius: 12px; backdrop-filter: blur(8px);
  }
  .form-bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 28px 36px;
    background: linear-gradient(180deg, rgba(244,239,230,0) 0%, var(--color-bg-page) 30%);
    z-index: 30;
  }
</style>
</head>
<body>
<div class="device">
  <div class="device-screen">
    <div class="dynamic-island"></div>
    <div class="status-bar light">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg viewBox="0 0 18 14" fill="currentColor"><path d="M9 1c3 0 5.7 1.1 7.8 3l-1.5 1.6C13.5 4 11.3 3 9 3S4.5 4 2.7 5.6L1.2 4C3.3 2.1 6 1 9 1zm0 4c2 0 3.8.7 5.2 2l-1.5 1.6C11.6 7.6 10.4 7 9 7s-2.6.6-3.7 1.6L3.8 7c1.4-1.3 3.2-2 5.2-2zm0 4c1 0 1.9.3 2.6 1l-2.6 2.7L6.4 10c.7-.7 1.6-1 2.6-1z"/></svg>
        <svg viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="19" height="9" rx="1.5" fill="currentColor"/><path d="M24 4v5h1.5V4H24z" fill="currentColor" opacity="0.5"/></svg>
      </div>
    </div>

    <div class="navbar on-hero" style="position: relative; z-index: 10; padding-top: 56px;">
      <button class="nav-back" data-back>
        <svg viewBox="0 0 24 24" class="icon"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="nav-title">新增衣物</span>
      <span style="width: 32px;"></span>
    </div>

    <div class="screen-content">
      <div class="page">
        <div class="page-bg"></div>

        <div class="form-page">
          <div class="form-page-hero fade-up delay-1">
            <div class="scope-badge">
              <span class="scope-badge-dot"></span>
              <span class="scope-badge-text">Add · 新增</span>
            </div>
            <h1 class="scope-title size-sm">新增衣物</h1>
            <p class="scope-desc">上传一张衣物照片，填写基础信息。</p>
          </div>

          <div class="form-body fade-up delay-2">
            <div class="form-section-title">衣物图片 <span class="hint">必填</span></div>
            <div class="image-preview">
              <span class="season-mark season-autumn"></span>
              <svg viewBox="0 0 24 24" class="icon"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
              <span class="replace-btn">重新上传</span>
            </div>

            <div class="form-section-title">名称</div>
            <input type="text" class="form-input" placeholder="例如：米色亚麻衬衫" value="米色亚麻衬衫">

            <div class="form-section-title">分类</div>
            <div class="chip-row" data-chip-group>
              <span class="chip active">上装</span>
              <span class="chip">下装</span>
              <span class="chip">外套</span>
              <span class="chip">鞋子</span>
              <span class="chip">配饰</span>
            </div>

            <div class="form-section-title">适合季节 <span class="hint">可多选</span></div>
            <div class="chip-row" data-chip-group data-multiple="true">
              <span class="chip">春</span>
              <span class="chip">夏</span>
              <span class="chip active">秋</span>
              <span class="chip active">冬</span>
            </div>

            <div class="form-section-title">归属衣橱 <span class="hint">可不选</span></div>
            <div class="chip-row" data-chip-group>
              <span class="chip active">主卧大衣橱</span>
              <span class="chip">次卧开放柜</span>
              <span class="chip">储物间抽屉柜</span>
              <span class="chip">暂不归类</span>
            </div>

            <div class="form-section-title">备注</div>
            <textarea class="form-textarea" placeholder="材质、颜色、品牌、购买时间…">亚麻 100%，2024 年 9 月购于 MUJI。</textarea>
          </div>
        </div>

        <div class="form-bottom-bar">
          <button class="btn-submit" data-submit="clothes.html">保存衣物</button>
        </div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
</div>
<script src="../assets/prototype.js"></script>
</body>
</html>

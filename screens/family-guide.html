<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭引导 — MyCloset 家庭衣橱</title>
<link rel="stylesheet" href="../assets/design-system.css">
<style>
  .guide-page { padding-top: 96px; }
  .guide-hero { padding: 0 28px 36px; position: relative; z-index: 2; color: var(--color-text-inverse); }
  .guide-hero .scope-title { margin-bottom: 10px; }
  .guide-hero .scope-desc { margin-bottom: 0; max-width: 280px; }
  .guide-options { padding: 0 28px 36px; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 12px; }
  .guide-option {
    background: var(--color-bg-card-end);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    padding: 22px;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .guide-option:hover {
    background: #fff;
    transform: translateY(-2px);
    box-shadow: var(--shadow-card);
  }
  .guide-option-num {
    font-family: var(--font-serif);
    font-size: 36px;
    font-weight: 300;
    color: var(--color-terra);
    line-height: 1;
    letter-spacing: -1px;
    flex-shrink: 0;
    width: 44px;
  }
  .guide-option-content { flex: 1; }
  .guide-option-title {
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 600;
    color: var(--color-primary-dark);
    margin-bottom: 4px;
  }
  .guide-option-desc {
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--color-text-placeholder);
    line-height: 1.5;
  }
  .guide-option-arrow {
    width: 16px; height: 16px;
    stroke: var(--color-text-placeholder);
    stroke-width: 1.5;
    fill: none;
    opacity: 0.4;
    flex-shrink: 0;
  }
  .guide-skip {
    text-align: center;
    padding: 8px 28px 60px;
    position: relative; z-index: 2;
  }
  .guide-skip a {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--color-text-placeholder);
    padding: 12px 24px;
    border-bottom: 1px solid var(--color-border);
  }
</style>
</head>
<body>
<div class="device">
  <div class="device-screen">
    <div class="dynamic-island"></div>
    <div class="status-bar light">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg viewBox="0 0 18 14" fill="currentColor"><path d="M9 1c3 0 5.7 1.1 7.8 3l-1.5 1.6C13.5 4 11.3 3 9 3S4.5 4 2.7 5.6L1.2 4C3.3 2.1 6 1 9 1zm0 4c2 0 3.8.7 5.2 2l-1.5 1.6C11.6 7.6 10.4 7 9 7s-2.6.6-3.7 1.6L3.8 7c1.4-1.3 3.2-2 5.2-2zm0 4c1 0 1.9.3 2.6 1l-2.6 2.7L6.4 10c.7-.7 1.6-1 2.6-1z"/></svg>
        <svg viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="19" height="9" rx="1.5" fill="currentColor"/><path d="M24 4v5h1.5V4H24z" fill="currentColor" opacity="0.5"/></svg>
      </div>
    </div>

    <div class="screen-content">
      <div class="page">
        <div class="page-bg"></div>

        <div class="guide-page">
          <div class="guide-hero fade-up delay-1">
            <div class="scope-badge">
              <span class="scope-badge-dot"></span>
              <span class="scope-badge-text">Family · 家庭引导</span>
            </div>
            <h1 class="scope-title">开启家庭协作</h1>
            <p class="scope-desc">加入后可以和家人共享衣橱与衣物，按角色协作管理。也可以稍后再设置。</p>
          </div>

          <div class="guide-options">
            <a class="guide-option fade-up delay-2" href="family-create.html">
              <span class="guide-option-num">01</span>
              <div class="guide-option-content">
                <div class="guide-option-title">创建家庭</div>
                <div class="guide-option-desc">新建一个家庭，自动生成邀请码，邀请家人加入。</div>
              </div>
              <svg class="guide-option-arrow icon" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </a>

            <a class="guide-option fade-up delay-3" href="family-join.html" onclick="event.preventDefault(); showToast('请在弹窗中输入邀请码');">
              <span class="guide-option-num">02</span>
              <div class="guide-option-content">
                <div class="guide-option-title">加入家庭</div>
                <div class="guide-option-desc">输入家人分享的邀请码，加入已存在的家庭。</div>
              </div>
              <svg class="guide-option-arrow icon" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </a>
          </div>

          <div class="guide-skip fade-up delay-4">
            <a href="home.html" data-submit="home.html">先跳过，使用个人模式</a>
          </div>
        </div>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
<script src="../assets/prototype.js"></script>
</body>
</html>

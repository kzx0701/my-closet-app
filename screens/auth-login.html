<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — MyCloset 家庭衣橱</title>
<link rel="stylesheet" href="../assets/design-system.css">
<style>
  .auth-back-btn {
    position: absolute;
    top: 56px; left: 28px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--color-text-inverse);
    z-index: 10;
  }
  .auth-back-btn svg { width: 18px; height: 18px; stroke: currentColor; }
  .form-link-row {
    display: flex; justify-content: space-between;
    margin-top: 18px;
    font-family: var(--font-sans); font-size: 12px;
    color: var(--inverse-55);
  }
  .form-link-row a { color: var(--color-terra-soft); font-weight: 500; }
</style>
</head>
<body>
<div class="device">
  <div class="device-screen">
    <div class="dynamic-island"></div>
    <div class="status-bar light">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg viewBox="0 0 18 14" fill="currentColor"><path d="M9 1c3 0 5.7 1.1 7.8 3l-1.5 1.6C13.5 4 11.3 3 9 3S4.5 4 2.7 5.6L1.2 4C3.3 2.1 6 1 9 1zm0 4c2 0 3.8.7 5.2 2l-1.5 1.6C11.6 7.6 10.4 7 9 7s-2.6.6-3.7 1.6L3.8 7c1.4-1.3 3.2-2 5.2-2zm0 4c1 0 1.9.3 2.6 1l-2.6 2.7L6.4 10c.7-.7 1.6-1 2.6-1z"/></svg>
        <svg viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="19" height="9" rx="1.5" fill="currentColor"/><path d="M24 4v5h1.5V4H24z" fill="currentColor" opacity="0.5"/></svg>
      </div>
    </div>

    <button class="auth-back-btn" data-back>
      <svg viewBox="0 0 24 24" class="icon"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div class="screen-content">
      <div class="auth-page fade-up delay-1">
        <div class="auth-content">
          <div class="auth-brand">
            <div class="auth-brand-mark">MyCloset · 家庭衣橱</div>
            <h1 class="auth-brand-title">欢迎回来</h1>
          </div>

          <div class="auth-form">
            <div class="form-group">
              <label class="form-label">用户名</label>
              <input type="text" class="form-input" placeholder="输入用户名" value="linyu">
            </div>
            <div class="form-group">
              <label class="form-label">密码</label>
              <input type="password" class="form-input" placeholder="输入密码" value="password">
            </div>

            <button class="auth-btn" data-submit="family-guide.html" style="margin-top: 14px;">登录</button>

            <div class="form-link-row">
              <a href="auth-register.html">注册新账号</a>
              <a href="#">忘记密码</a>
            </div>
          </div>

          <div class="auth-footer">
            登录即代表同意《用户协议》和《隐私政策》
          </div>
        </div>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
<script src="../assets/prototype.js"></script>
</body>
</html>

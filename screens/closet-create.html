<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建衣橱 — MyCloset 家庭衣橱</title>
<link rel="stylesheet" href="../assets/design-system.css">
<style>
  .form-page { padding-top: 96px; }
  .form-page-hero { padding: 0 28px 24px; position: relative; z-index: 2; color: var(--color-text-inverse); }
  .form-page-hero .scope-title { margin-bottom: 10px; }
  .form-page-hero .scope-desc { margin-bottom: 0; }
  .form-body { padding: 24px 28px 120px; position: relative; z-index: 2; }
  .form-section-title {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--color-text-placeholder); margin-bottom: 12px; margin-top: 24px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .form-section-title .hint { font-family: var(--font-sans); font-size: 11px; color: var(--color-text-placeholder); text-transform: none; letter-spacing: 0; }
  .form-section-title:first-child { margin-top: 0; }
  .form-bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 28px 36px;
    background: linear-gradient(180deg, rgba(244,239,230,0) 0%, var(--color-bg-page) 30%);
    z-index: 30;
  }
</style>
</head>
<body>
<div class="device">
  <div class="device-screen">
    <div class="dynamic-island"></div>
    <div class="status-bar light">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg viewBox="0 0 18 14" fill="currentColor"><path d="M9 1c3 0 5.7 1.1 7.8 3l-1.5 1.6C13.5 4 11.3 3 9 3S4.5 4 2.7 5.6L1.2 4C3.3 2.1 6 1 9 1zm0 4c2 0 3.8.7 5.2 2l-1.5 1.6C11.6 7.6 10.4 7 9 7s-2.6.6-3.7 1.6L3.8 7c1.4-1.3 3.2-2 5.2-2zm0 4c1 0 1.9.3 2.6 1l-2.6 2.7L6.4 10c.7-.7 1.6-1 2.6-1z"/></svg>
        <svg viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="19" height="9" rx="1.5" fill="currentColor"/><path d="M24 4v5h1.5V4H24z" fill="currentColor" opacity="0.5"/></svg>
      </div>
    </div>

    <!-- 顶部导航 -->
    <div class="navbar on-hero" style="position: relative; z-index: 10; padding-top: 56px;">
      <button class="nav-back" data-back>
        <svg viewBox="0 0 24 24" class="icon"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="nav-title">新建衣橱</span>
      <span style="width: 32px;"></span>
    </div>

    <div class="screen-content">
      <div class="page">
        <div class="page-bg"></div>

        <div class="form-page">
          <div class="form-page-hero fade-up delay-1">
            <div class="scope-badge">
              <span class="scope-badge-dot"></span>
              <span class="scope-badge-text">Personal · 个人空间</span>
            </div>
            <h1 class="scope-title size-sm">新建衣橱</h1>
            <p class="scope-desc">选择样式与配色，记录衣橱所在房间。</p>
          </div>

          <div class="form-body fade-up delay-2">
            <div class="form-section-title">名称</div>
            <input type="text" class="form-input" placeholder="例如：主卧大衣橱" value="主卧大衣橱">

            <div class="form-section-title">样式 <span class="hint">选一个最接近的</span></div>
            <div class="style-grid" data-style-group>
              <div class="style-card active">
                <div class="style-card-name">简约平门柜</div>
                <div class="style-card-desc">线条简洁，适合大多数卧室场景。</div>
              </div>
              <div class="style-card">
                <div class="style-card-name">弧顶复古柜</div>
                <div class="style-card-desc">轮廓更柔和，氛围感更强。</div>
              </div>
              <div class="style-card">
                <div class="style-card-name">开放式收纳柜</div>
                <div class="style-card-desc">更轻盈，适合衣物分区展示。</div>
              </div>
              <div class="style-card">
                <div class="style-card-name">抽屉组合柜</div>
                <div class="style-card-desc">适合兼顾挂衣与叠放的收纳方式。</div>
              </div>
            </div>

            <div class="form-section-title">配色</div>
            <div class="swatch-row" data-swatch-group>
              <div class="swatch swatch-oak-beige active" style="--swatch-color: #d4b896;" title="浅橡木"></div>
              <div class="swatch swatch-walnut-brown" style="--swatch-color: #6b4423;" title="胡桃棕"></div>
              <div class="swatch swatch-mist-white" style="--swatch-color: #e8e4dc;" title="雾感白"></div>
              <div class="swatch swatch-sage-green" style="--swatch-color: #a8bcae;" title="鼠尾草绿"></div>
            </div>

            <div class="form-section-title">所在房间</div>
            <input type="text" class="form-input" placeholder="例如：主卧、次卧、储物间" value="主卧">

            <div class="form-section-title">归属空间</div>
            <div class="chip-row" data-chip-group>
              <span class="chip active">个人空间</span>
              <span class="chip">林家小院</span>
            </div>
          </div>
        </div>

        <div class="form-bottom-bar">
          <button class="btn-submit" data-submit="closets.html">创建衣橱</button>
        </div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
</div>
<script src="../assets/prototype.js"></script>
</body>
</html>
